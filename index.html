<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link

      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="

  <body>
    <div class="container">
      <nav>

        </div>
        <div class="nav-items">
          <a href="/index.html">home</a>

          <li>

    <script src="app.js" type="module">

      requireAuth();
